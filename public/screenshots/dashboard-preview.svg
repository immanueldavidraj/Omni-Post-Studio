    <!-- Content Snippet -->
    <text x="16" y="118" class="font-sans" font-size="11" fill="#334155" line-height="16">
      <tspan x="16" dy="0">When we set out to build an AI canvas, latency was 2.4s.</tspan>
      <tspan x="16" dy="16">Users dropped off. So we re-architected everything:</tspan>
      <tspan x="16" dy="16">• Edge-native streaming pipelines</tspan>
      <tspan x="16" dy="16">• Speculative UI rendering</tspan>
      <tspan x="16" dy="16">• Lightweight vector caches</tspan>
      <tspan x="16" dy="18">The result? 320ms roundtrips and a 4.8x boost in DAU.</tspan>
    </text>

    <!-- Hashtags -->
    <rect x="16" y="222" width="76" height="20" rx="4" fill="#f1f5f9" />
    <text x="22" y="236" class="font-sans" font-size="10" font-weight="600" fill="#4338ca">#BuildInPublic</text>

    <rect x="98" y="222" width="82" height="20" rx="4" fill="#f1f5f9" />
    <text x="104" y="236" class="font-sans" font-size="10" font-weight="600" fill="#4338ca">#AIEngineering</text>

    <rect x="186" y="222" width="58" height="20" rx="4" fill="#f1f5f9" />
    <text x="192" y="236" class="font-sans" font-size="10" font-weight="600" fill="#4338ca">#Startups</text>

    <!-- Image Preview 16:9 -->
    <rect x="16" y="250" width="362" height="152" rx="10" fill="url(#imgBanner1)" />
    <rect x="28" y="266" width="70" height="20" rx="4" fill="#000000" opacity="0.4" />
    <text x="34" y="280" class="font-mono" font-size="9" fill="#ffffff">RATIO: 16:9</text>
    <circle cx="197" cy="326" r="32" fill="#ffffff" opacity="0.15" />
    <text x="197" y="322" class="font-sans" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">SUB-SECOND AI</text>
    <text x="197" y="340" class="font-mono" font-size="11" fill="#c7d2fe" text-anchor="middle">2,400ms → 320ms LATENCY</text>

    <!-- Footer Action -->
    <rect x="16" y="416" width="362" height="32" rx="8" fill="#4f46e5" />
    <text x="197" y="436" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📋 Copy LinkedIn Post</text>
  </g>

