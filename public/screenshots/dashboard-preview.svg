    <line x1="0" y1="52" x2="394" y2="52" stroke="#e2e8f0" stroke-width="1" />
    
    <rect x="16" y="12" width="28" height="28" rx="6" fill="url(#igGrad)" />
    <circle cx="30" cy="26" r="6" stroke="#ffffff" stroke-width="2" fill="none" />
    <circle cx="37" cy="19" r="1.5" fill="#ffffff" />
    
    <text x="54" y="25" class="font-sans" font-size="11" font-weight="800" fill="#1e293b" letter-spacing="1">INSTAGRAM</text>
    <text x="54" y="39" class="font-sans" font-size="10" fill="#64748b">Visual Story • Square 1:1 Aspect</text>

    <!-- Tab bar -->
    <rect x="230" y="12" width="150" height="26" rx="6" fill="#f1f5f9" />
    <rect x="232" y="14" width="46" height="22" rx="5" fill="#ffffff" />
    <text x="238" y="29" class="font-sans" font-size="10" font-weight="700" fill="#4338ca">Edit</text>
    <text x="286" y="29" class="font-sans" font-size="10" font-weight="500" fill="#64748b">Mockup</text>
    <text x="340" y="29" class="font-sans" font-size="10" font-weight="500" fill="#64748b">Audit</text>

    <!-- Hook Box -->
    <rect x="16" y="64" width="362" height="34" rx="8" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" />
    <line x1="16" y1="64" x2="16" y2="98" stroke="#db2777" stroke-width="4" />
    <text x="26" y="77" class="font-sans" font-size="9" font-weight="700" fill="#9d174d">STORY HOOK</text>
    <text x="26" y="90" class="font-sans" font-size="11" font-weight="600" fill="#831843">"320ms. That's how fast ideas should flow."</text>

    <!-- Content Snippet -->
    <text x="16" y="118" class="font-sans" font-size="11" fill="#334155" line-height="16">
      <tspan x="16" dy="0">Behind every fluid creative flow is intense engineering.</tspan>
      <tspan x="16" dy="16">We just deployed our zero-latency canvas update. ✨</tspan>
      <tspan x="16" dy="16">Drop a '⚡️' below if you'd love early beta access!</tspan>
      <tspan x="16" dy="20">. . .</tspan>
      <tspan x="16" dy="16" fill="#4338ca" font-weight="600">#DesignTools #AITools #TechFounder</tspan>
    </text>

    <!-- Image Preview 1:1 -->
    <rect x="16" y="214" width="362" height="188" rx="10" fill="url(#imgBanner3)" />
    <rect x="28" y="226" width="60" height="20" rx="4" fill="#000000" opacity="0.4" />
    <text x="34" y="240" class="font-mono" font-size="9" fill="#ffffff">RATIO: 1:1</text>
    <circle cx="197" cy="308" r="44" fill="#ffffff" opacity="0.2" />
    <text x="197" y="304" class="font-sans" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">FLOW</text>
    <text x="197" y="324" class="font-sans" font-size="10" font-weight="600" fill="#fecdd3" text-anchor="middle">COLLABORATIVE AI CANVAS</text>

    <!-- Footer Action -->
    <rect x="16" y="416" width="362" height="32" rx="8" fill="#e11d48" />
    <text x="197" y="436" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📋 Copy Instagram Caption</text>
  </g>
</svg>
