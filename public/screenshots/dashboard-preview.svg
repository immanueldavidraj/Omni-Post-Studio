    <rect x="16" y="12" width="28" height="28" rx="6" fill="url(#twGrad)" />
    <text x="24" y="31" class="font-sans" font-size="14" font-weight="800" fill="#ffffff">𝕏</text>
    
    <text x="54" y="25" class="font-sans" font-size="11" font-weight="800" fill="#1e293b" letter-spacing="1">TWITTER / X</text>
    <text x="54" y="39" class="font-sans" font-size="10" fill="#10b981" font-weight="700">248 / 280 chars • Perfect length</text>

    <!-- Tab bar -->
    <rect x="230" y="12" width="150" height="26" rx="6" fill="#f1f5f9" />
    <rect x="232" y="14" width="46" height="22" rx="5" fill="#ffffff" />
    <text x="238" y="29" class="font-sans" font-size="10" font-weight="700" fill="#4338ca">Edit</text>
    <text x="286" y="29" class="font-sans" font-size="10" font-weight="500" fill="#64748b">Mockup</text>
    <text x="340" y="29" class="font-sans" font-size="10" font-weight="500" fill="#64748b">Audit</text>

    <!-- Hook Box -->
    <rect x="16" y="64" width="362" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <line x1="16" y1="64" x2="16" y2="98" stroke="#0f172a" stroke-width="4" />
    <text x="26" y="77" class="font-sans" font-size="9" font-weight="700" fill="#475569">VIRAL X HOOK</text>
    <text x="26" y="90" class="font-sans" font-size="11" font-weight="600" fill="#0f172a">"If your AI takes &gt;1 sec to respond, users leave."</text>

    <!-- Content Snippet -->
    <text x="16" y="118" class="font-sans" font-size="11" fill="#334155" line-height="16">
      <tspan x="16" dy="0">If your AI takes &gt;1 sec to respond, users leave.</tspan>
      <tspan x="16" dy="16">Here's how we slashed our canvas latency by 87%:</tspan>
      <tspan x="16" dy="16">1/ Stream directly from edge nodes</tspan>
      <tspan x="16" dy="16">2/ Zero blocking calls on UI thread</tspan>
      <tspan x="16" dy="16">3/ Micro-caching frequent prompts</tspan>
      <tspan x="16" dy="18">Speed is retention. ⚡️ #buildinpublic #tech</tspan>
    </text>

    <!-- Quick polish pill toolbar -->
    <rect x="16" y="214" width="86" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="24" y="230" class="font-sans" font-size="10" fill="#475569">⚡ Make punchier</text>

    <rect x="108" y="214" width="84" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="116" y="230" class="font-sans" font-size="10" fill="#475569">✂️ Trim &lt;280c</text>

    <rect x="198" y="214" width="78" height="24" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="206" y="230" class="font-sans" font-size="10" fill="#475569">🎯 Add CTA</text>

    <!-- Image Preview 16:9 -->
    <rect x="16" y="250" width="362" height="152" rx="10" fill="url(#imgBanner2)" />
    <rect x="28" y="266" width="70" height="20" rx="4" fill="#000000" opacity="0.4" />
    <text x="34" y="280" class="font-mono" font-size="9" fill="#ffffff">RATIO: 16:9</text>
    <path d="M120 340 L170 300 L220 320 L270 280" stroke="#38bdf8" stroke-width="3" fill="none" />
    <circle cx="270" cy="280" r="5" fill="#38bdf8" />
    <text x="197" y="356" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">RETENTION CURVE BY LATENCY</text>

    <!-- Footer Action -->
    <rect x="16" y="416" width="362" height="32" rx="8" fill="#18181b" />
    <text x="197" y="436" class="font-sans" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">📋 Copy Tweet</text>
  </g>

