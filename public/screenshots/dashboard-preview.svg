  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1280" height="760" fill="url(#bgGrad)" />

  <!-- App Header -->
  <rect x="30" y="24" width="1220" height="68" rx="16" fill="#ffffff" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1" />
  
  <!-- Logo & Title -->
  <rect x="48" y="38" width="40" height="40" rx="10" fill="url(#primaryGrad)" />
  <path d="M68 46 L76 58 L60 58 Z" fill="#ffffff" opacity="0.9" />
  <circle cx="68" cy="62" r="3" fill="#ffffff" />
  
  <text x="100" y="55" class="font-sans" font-size="16" font-weight="700" fill="#0f172a">Cross-Platform Social Media Content Generator</text>
  <text x="100" y="73" class="font-sans" font-size="12" fill="#64748b">Transform raw ideas into tailored LinkedIn, Twitter/X, and Instagram posts + AI visual assets</text>

  <!-- Header Right Actions -->
  <rect x="990" y="42" width="120" height="32" rx="8" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="1" />
  <text x="1004" y="62" class="font-sans" font-size="12" font-weight="600" fill="#4338ca">⚡ Gemini 3.5 Engine</text>

  <rect x="1122" y="42" width="112" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="1144" y="62" class="font-sans" font-size="12" font-weight="600" fill="#334155">🕒 History (4)</text>

  <!-- Idea Input Card -->
  <rect x="30" y="104" width="1220" height="152" rx="16" fill="#ffffff" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1" />

  <text x="50" y="128" class="font-sans" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">YOUR IDEA (CONCEPT, ANNOUNCEMENT, OR STORY)</text>
  
  <!-- Idea Text Area Mockup -->
  <rect x="50" y="136" width="1180" height="42" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <text x="64" y="162" class="font-sans" font-size="13" fill="#1e293b" font-weight="500">We just launched our real-time collaboration canvas with instant AI summarization. 3 big lessons on reducing latency from 2.4s to 320ms...</text>

  <!-- Tone Pills and Generate Button Row -->
  <text x="50" y="202" class="font-sans" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">TONE:</text>
  
  <!-- Selected Inspiring Tone -->
  <rect x="100" y="188" width="100" height="28" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
  <text x="114" y="206" class="font-sans" font-size="11" font-weight="700" fill="#4338ca">✨ Inspiring</text>

  <rect x="208" y="188" width="108" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="220" y="206" class="font-sans" font-size="11" font-weight="500" fill="#475569">👔 Professional</text>

  <rect x="324" y="188" width="88" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="336" y="206" class="font-sans" font-size="11" font-weight="500" fill="#475569">💬 Casual</text>

  <rect x="420" y="188" width="112" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="432" y="206" class="font-sans" font-size="11" font-weight="500" fill="#475569">⚡ High-Energy</text>

  <rect x="540" y="188" width="108" height="28" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="552" y="206" class="font-sans" font-size="11" font-weight="500" fill="#475569">📚 Educational</text>

  <!-- Resolution controls -->
  <rect x="670" y="188" width="150" height="28" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="680" y="206" class="font-sans" font-size="11" font-weight="600" fill="#64748b">Size:</text>
  <rect x="716" y="191" width="30" height="22" rx="6" fill="#ffffff" />
  <text x="722" y="206" class="font-sans" font-size="11" font-weight="700" fill="#4338ca">1K</text>
  <text x="756" y="206" class="font-sans" font-size="11" fill="#64748b">2K</text>
  <text x="790" y="206" class="font-sans" font-size="11" fill="#64748b">4K</text>

  <!-- Generate Master Button -->
  <rect x="910" y="186" width="320" height="32" rx="8" fill="url(#primaryGrad)" filter="url(#shadowSm)" />
  <text x="946" y="206" class="font-sans" font-size="12" font-weight="700" fill="#ffffff">✨ Generate Cross-Platform Posts &amp; Images</text>

  <!-- 3 Side-by-Side Platform Cards -->
  <!-- COLUMN 1: LINKEDIN -->
  <g transform="translate(30, 268)">
    <rect width="394" height="460" rx="16" fill="#ffffff" filter="url(#shadowSm)" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Header -->
    <rect width="394" height="52" rx="16" fill="#f8fafc" />
    <rect x="0" y="36" width="394" height="16" fill="#f8fafc" />
    <line x1="0" y1="52" x2="394" y2="52" stroke="#e2e8f0" stroke-width="1" />
    
    <rect x="16" y="12" width="28" height="28" rx="6" fill="url(#liGrad)" />
    <text x="23" y="31" class="font-sans" font-size="14" font-weight="800" fill="#ffffff">in</text>
    
    <text x="54" y="25" class="font-sans" font-size="11" font-weight="800" fill="#1e293b" letter-spacing="1">LINKEDIN</text>
    <text x="54" y="39" class="font-sans" font-size="10" fill="#64748b">742 chars • Ideal: 800 - 1800</text>

    <!-- Tab bar -->
    <rect x="230" y="12" width="150" height="26" rx="6" fill="#f1f5f9" />
    <rect x="232" y="14" width="46" height="22" rx="5" fill="#ffffff" />
    <text x="238" y="29" class="font-sans" font-size="10" font-weight="700" fill="#4338ca">Edit</text>
    <text x="286" y="29" class="font-sans" font-size="10" font-weight="500" fill="#64748b">Mockup</text>
    <text x="340" y="29" class="font-sans" font-size="10" font-weight="500" fill="#64748b">Audit</text>

